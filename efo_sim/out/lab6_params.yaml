lab6:
  kilometre_taslari:
    deger: {ilk_mudahale: 15, ilk_asama: 120, erken_uyari: 1440, bildirim: 4320, son_rapor: 20160}
    birim: "dk"
    etiket: "SEKTÖR-TİPİK"
    kaynak: "föy LAB 6, Y20, Y22"
    not: "10:15'ten itibaren: 15 dk, 2 sa, 24 sa, 72 sa, 14 gün"
  # Referans (onaylı) konfigürasyon ve olay sırasında okunan konfigürasyon
  referans_konfig:
    deger: {plc_proje_crc: "7A3F-19C2", emniyet_rolesi_ayar: "SS1-t 1,0 s", rampa_suresi: 0.5, hiz_carpani: 1.0}
    etiket: "VARSAYIM"
    kaynak: "V19"
    not: "Devreye almadaki onaylı yedek. Rampa lab1.rampa_suresi_kat1 ile aynı"
  okunan_konfig:
    deger: {plc_proje_crc: "C04D-88E1", emniyet_rolesi_ayar: "SS1-t 1,0 s", rampa_suresi: 10.0, hiz_carpani: 1.0}
    etiket: "VARSAYIM"
    kaynak: "V19"
    not: "Olay sırasında salt okunur olarak alınan döküm: PLC projesi farklı, rampa 10 s (LAB 3 saldırısı)"

  # 6.4 Etki alanı: üreticinin sahadaki kurulum filosu (paylaşılan servis hesabı hangi kurulumlara açılıyor?)
  # hesap: paylasilan | kisisel; uzak: surekli (router hep açık) | onayli (tesis onayıyla) | yok
  # emniyet: LAB 4 bağımsızlık varyantı (bagimli | bagimsiz | bagimsiz_hiz_izlemeli)
  kurulumlar:
    deger:
      - {id: M1, ad: "Bu olayın tesisi", hesap: paylasilan, uzak: surekli, emniyet: bagimli}
      - {id: M2, ad: "Müşteri B", hesap: paylasilan, uzak: surekli, emniyet: bagimli}
      - {id: M3, ad: "Müşteri C", hesap: paylasilan, uzak: surekli, emniyet: bagimsiz}
      - {id: M4, ad: "Müşteri D", hesap: paylasilan, uzak: onayli, emniyet: bagimli}
      - {id: M5, ad: "Müşteri E", hesap: paylasilan, uzak: yok, emniyet: bagimli}
      - {id: M6, ad: "Müşteri F", hesap: kisisel, uzak: surekli, emniyet: bagimli}
    etiket: "VARSAYIM"
    kaynak: "V24, V19"
    not: "Efo'nun gerçek filosu bilinmiyor; karışık bir filo varsayıldı. M1 LAB 6 olayının tesisi"
  # 6.5 Kanıt ömrü: bu süreden sonra kanıt kendiliğinden silinir (halka tampon / log döndürme). Listede olmayan kalıcı
  kanit_omru:
    deger: {K3: 720, K4: 1440}
    birim: "dk"
    etiket: "VARSAYIM"
    kaynak: "V25, Y31"
    not: "K3 router logu 12 sa (küçük halka tampon), K4 HMI logu 24 sa döndürülüyor"
  gec_ekip_gecikmesi:
    {deger: 810, birim: "dk", etiket: "VARSAYIM", kaynak: "V25",
     not: "OT güvenlik ekibi ertesi sabah gelir: ilk 2 saatten sonraki kanıt eylemleri bu kadar kayar (10:15 → +13:30)"}
