# efo_sim — tüm sayısal değerler
#
# Her değerin yanında etiketi ve kaynağı var:
#   etiket: SEKTÖR-TİPİK | VARSAYIM | ÇIKARIM
#   kaynak: R<n> = derin araştırma raporu kaynak no, Y<n> = bu çalışmada eklenen kaynak,
#           V<n> = Makine Profili'ndeki varsayım kimliği
# Efo Makina bu değerleri yayınlamıyor. Bunlar eğitim amaçlı model girdileridir;
# gerçek ürünün değerleri değildir.

lab1:
  # --- 1.2 Durma mesafesi modeli ---
  bant_hizi:
    {deger: 0.5, birim: "m/s", etiket: "VARSAYIM", kaynak: "V6",
     not: "Besleme bandı nominal hızı; Efo yayınlamıyor"}
  insan_reaksiyon_suresi:
    {deger: 0.7, birim: "s", etiket: "VARSAYIM", kaynak: "V6",
     not: "Kapılan kişinin ya da yanındakinin acil stopa/çekme ipine uzanma süresi"}
  sistem_tepki_suresi:
    {deger: 0.05, birim: "s", etiket: "SEKTÖR-TİPİK", kaynak: "R47",
     not: "Algılama + emniyet rölesi + STO tetikleme; röle kataloglarında onlarca ms mertebesi"}
  durma_suresi_kat0:
    {deger: 0.4, birim: "s", etiket: "VARSAYIM", kaynak: "V6",
     not: "Stop kat. 0: STO ile tork hemen kesilir, yüklü bant sürtünmeyle durur (nominal hızdan)"}
  rampa_suresi_kat1:
    {deger: 0.5, birim: "s", etiket: "VARSAYIM", kaynak: "V2",
     not: "Stop kat. 1: invertör nominal hızdan sıfıra kontrollü yavaşlatır, sonra STO"}
  ss1_gecikmesi:
    {deger: 1.0, birim: "s", etiket: "VARSAYIM", kaynak: "V4",
     not: "SS1-t: emniyet rölesi bu süre sonunda rampadan bağımsız olarak STO verir"}
  guvenli_mesafe:
    {deger: 1.5, birim: "m", etiket: "SEKTÖR-TİPİK", kaynak: "Y11",
     not: "Elin kapılabildiği en yakın nokta ile besleme ağzı arası. WorkSafe Victoria'nın besleme ağzı ≥1500 mm önerisi analoji olarak alındı"}
  grafik_hiz_araligi:
    {deger: [0.1, 2.0], birim: "m/s", etiket: "VARSAYIM", kaynak: "V6",
     not: "Durma mesafesi grafiğinde taranan bant hızı aralığı"}
  grafik_nokta_sayisi:
    {deger: 60, birim: "adet", etiket: "VARSAYIM", kaynak: "-", not: "Grafik çözünürlüğü"}

  # --- 1.3 ISO 13849-1 risk grafiği (S, F, P -> PLr) ---
  plr_grafigi:
    deger:
      S1-F1-P1: a
      S1-F1-P2: b
      S1-F2-P1: b
      S1-F2-P2: c
      S2-F1-P1: c
      S2-F1-P2: d
      S2-F2-P1: d
      S2-F2-P2: e
    etiket: "SEKTÖR-TİPİK"
    kaynak: "Y21"
    not: "ISO 13849-1 risk grafiğinin standart eşlemesi"
  pl_sil_karsiligi:
    deger: {a: "—", b: "SIL 1", c: "SIL 1", d: "SIL 2", e: "SIL 3"}
    etiket: "SEKTÖR-TİPİK"
    kaynak: "Y21"
    not: "Yaklaşık karşılık; eşdeğerlik değildir"
  pl_tipik_kategori:
    deger: {a: "B", b: "B / 1", c: "1 / 2 / 3", d: "2 / 3", e: "3 / 4"}
    etiket: "SEKTÖR-TİPİK"
    kaynak: "Y21"
    not: "Ulaşılabilen kategoriler; MTTFd, DCavg ve CCF ile birlikte değerlendirilir"

  # Emniyet fonksiyonları ve risk parametresi seçimleri
  emniyet_fonksiyonlari:
    deger:
      - id: SF1
        ad: "Acil stop / çekme ipi → STO"
        tehlike: "Besleme ağzına çekilme; tambur kıstırma noktası"
        S: S2
        F: F2
        P: P2
        gerekce: "S2: çekilme ölümcül (Y9, Y10). F2: çalışanlar bant yanında sık (Y3). P2: bant elini çektikten sonra kaçınmak neredeyse imkânsız"
      - id: SF2
        ad: "Kilitli koruyucu kapak açılınca STO"
        tehlike: "Tambur, makara ve sarsak kollarında kıstırma"
        S: S2
        F: F1
        P: P2
        gerekce: "S2: kıstırma uzuv kaybına yol açabilir (R38, R39). F1: kapaklar yalnızca bakım/temizlikte açılır. P2: hareketli parçaya temas anında kaçınılamaz"
      - id: SF3
        ad: "Yongalama makinesi interlock'u: yongalama durursa besleme durur"
        tehlike: "Besleme ağzında yığılma → elle sıkışma açma"
        S: S2
        F: F1
        P: P1
        gerekce: "S2: sıkışma açarken çekilme (Y9). F1: seyrek. P1: yığılma görünür, operatör prosedürle kaçınabilir"
      - id: SF4
        ad: "Beklenmedik yol almanın önlenmesi (reset ≠ start)"
        tehlike: "Reset ya da kapak kapanınca bandın kendiliğinden çalışması"
        S: S2
        F: F1
        P: P2
        gerekce: "S2: bakımcı tambur yanında (R33). F1: bakım periyodik. P2: beklenmedik harekette kaçınma yok"
    etiket: "ÇIKARIM"
    kaynak: "V4"
    not: "S/F/P seçimleri bu çalışmanın yorumudur; Efo'nun risk değerlendirmesi yayınlanmamış"

lab2:
  # Zone/conduit verisi lab2_zones.py içinde; burada yalnızca sayısal eşik var
  conduit_min_kontrol_sayisi:
    {deger: 1, birim: "adet", etiket: "SEKTÖR-TİPİK", kaynak: "R12",
     not: "Her conduit'te en az bir kontrol tanımlı olmalı"}

lab3:
  puan_araligi:
    {deger: [1, 3], birim: "-", etiket: "SEKTÖR-TİPİK", kaynak: "föy LAB 3",
     not: "L, S, E her biri 1–3"}
  oncelikli_siddet:
    {deger: 3, birim: "-", etiket: "SEKTÖR-TİPİK", kaynak: "föy LAB 3",
     not: "S=3 kuralı: skor düşük olsa bile öne alınır"}
  bantlar:
    deger:
      - {ad: "Kritik", min: 18, max: 27}
      - {ad: "Yüksek", min: 9, max: 17}
      - {ad: "Orta", min: 4, max: 8}
      - {ad: "Düşük", min: 1, max: 3}
    etiket: "SEKTÖR-TİPİK"
    kaynak: "föy LAB 3"
    not: "Föydeki bant sınırları"
  duyarlilik_adimi:
    {deger: 1, birim: "puan", etiket: "VARSAYIM", kaynak: "-",
     not: "Varsayıma dayalı her puan ±1 değiştirilir"}

  # 3.3 Siberden fiziksele: saldırganın değiştirdiği invertör parametreleri
  saldiri_rampa_suresi:
    {deger: 10.0, birim: "s", etiket: "VARSAYIM", kaynak: "Y17",
     not: "Saldırgan yavaşlama rampasını 0,5 s'den 10 s'ye çıkarır (parametre uzaktan/WLAN ile yazılabilir)"}
  saldiri_hiz_carpani:
    {deger: 1.6, birim: "×", etiket: "VARSAYIM", kaynak: "Y17",
     not: "Saldırgan maksimum frekansı yükselterek bant hızını 1,6 katına çıkarır (50 Hz → 80 Hz)"}

  # Senaryolar: kim → kapı → ne yapar → zincir → fiziksel sonuç; her puanın dayanağı
  senaryolar:
    deger:
      - id: S1
        kim: "Dış saldırgan (çalınmış servis parolası ya da fidye yazılımı)"
        kapi: "Sürekli açık uzak destek bağlantısı (4G/VPN router ya da uzak masaüstü aracı)"
        ne_yapar: "Bant invertörünün yavaşlama rampasını 0,5 s'den 10 s'ye çıkarır"
        zincir: "Acil stop basıldığında STO, invertör rampası bittikten sonra geliyor (emniyet invertöre bağımlı) → bant 10 s boyunca kayar"
        fiziksel_sonuc: "Bant tarafından çekilen el/kol, bant durmadan besleme ağzına ulaşır → yongalama makinesine çekilme"
        L: {deger: 2, etiket: "ÇIKARIM", dayanak: "KOBİ'lerde sürekli açık uzak erişim yaygın (R13); hedefli parametre değişikliği ek bilgi ister"}
        S: {deger: 3, etiket: "SEKTÖR-TİPİK", dayanak: "Yongalama ölümlerinin %78'i çekilme (Y9); elle beslemede ölüm (Y10)"}
        E: {deger: 3, etiket: "ÇIKARIM", dayanak: "Çalışanlar bant kenarında ve platformda (Y3)"}
      - id: S2
        kim: "Servis teknisyeni (kasıtsız) — enfekte ya da yanlış projeli servis laptopu"
        kapi: "Kilitsiz USB / pano içindeki mühendislik portu"
        ne_yapar: "PLC'ye yongalama interlock'u devre dışı kalmış eski bir proje yüklenir"
        zincir: "Yongalama makinesi durduğunda besleme devam eder → besleme ağzında yığılma ve sıkışma → operatör elle müdahale eder"
        fiziksel_sonuc: "Sıkışma açılırken malzeme aniden kapılır → el/kolun yongalama makinesine çekilmesi"
        L: {deger: 2, etiket: "ÇIKARIM", dayanak: "Servis laptopu ile bağlantı rutin; ağdan bağımsız yayılma yolu (rapor E.3)"}
        S: {deger: 3, etiket: "SEKTÖR-TİPİK", dayanak: "Sıkışma açarken çekilme ölümcül (Y9)"}
        E: {deger: 2, etiket: "VARSAYIM", dayanak: "Sıkışma açma ara sıra yapılır"}
      - id: S3
        kim: "Fabrika ağına erişimi olan içeriden biri ya da ağdaki zararlı yazılım"
        kapi: "PLC web arayüzü (S7-1200 < V4.7, CVE-2024-47100: CSRF)"
        ne_yapar: "Oturum açmış operatöre link tıklatarak CPU'yu RUN moduna alır"
        zincir: "Bakım için bant yalnızca PLC'den durdurulmuş, enerji kilitlenmemiş (LOTO yok) → CPU RUN'a geçince bant beklenmedik çalışır"
        fiziksel_sonuc: "Tambur yanında çalışan bakımcının kıstırılması / çekilmesi"
        L: {deger: 1, etiket: "ÇIKARIM", dayanak: "Kullanıcı etkileşimi + ağ erişimi + LOTO ihlali birlikte gerekir (Y12)"}
        S: {deger: 3, etiket: "SEKTÖR-TİPİK", dayanak: "Bakım sırasında beklenmedik çalışma ezilme ve çekilmeye yol açar (R33)"}
        E: {deger: 2, etiket: "VARSAYIM", dayanak: "Bakım periyodik"}
      - id: K1
        kim: "Dış saldırgan"
        kapi: "Bulut telemetri hesabı"
        ne_yapar: "Titreşim ve sıcaklık verisini okur"
        zincir: "Telemetri yalnızca okuma yönünde; makineye komut yolu yok"
        fiziksel_sonuc: "Hattaki insana fiziksel etki yok (altın kural kontrolü: emniyet bulgusu değil)"
        L: {deger: 2, etiket: "VARSAYIM", dayanak: "Bulut hesapları sık hedeflenir"}
        S: {deger: 1, etiket: "ÇIKARIM", dayanak: "Fiziksel zarar zinciri yok"}
        E: {deger: 3, etiket: "VARSAYIM", dayanak: "Telemetri sürekli açık"}
    etiket: "ÇIKARIM"
    kaynak: "V2, V3, V5, V7"
    not: "Puanların dayanakları senaryo içinde; K1 föydeki üç senaryoya ek kontrol senaryosudur"

lab4:
  # Hedef mimaride hız izleme eşiği (gereksinim gösterimi)
  hiz_izleme_esigi_carpani:
    {deger: 1.2, birim: "×", etiket: "VARSAYIM", kaynak: "V4",
     not: "Emniyet tarafı bant hızını izler; nominalin 1,2 katını aşarsa durdurur (gereksinimin gösterimi, çözüm önerisi değil)"}
  alternatif_guvenli_mesafe:
    {deger: 1.0, birim: "m", etiket: "VARSAYIM", kaynak: "V8",
     not: "Varsayım etkisi hesabı: gerçek mesafe daha kısa olsaydı"}
  arama_araligi_ss1:
    {deger: [0.1, 10.0], birim: "s", etiket: "VARSAYIM", kaynak: "-",
     not: "SS1-t gecikmesi için eşik aramasının aralığı"}
  arama_araligi_esik:
    {deger: [1.0, 3.0], birim: "×", etiket: "VARSAYIM", kaynak: "-",
     not: "Hız izleme eşiği için eşik aramasının aralığı"}
  arama_adim_sayisi:
    {deger: 60, birim: "adet", etiket: "VARSAYIM", kaynak: "-", not: "İkiye bölme (bisection) adım sayısı"}
